[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-geocoder"
version = "0.1.0"
description = "OpenStreetMap geocoder, extractors, routing graphs, and visualization workflows for Facetwork"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ralph Lemke"}]
keywords = ["facetwork", "ffl", "openstreetmap", "osm", "geocoding", "geospatial", "postgis"]

dependencies = [
    "facetwork>=0.31.0",
    "requests>=2.28",
    "osmium>=4.0",
    "osm2geojson>=0.3",
    "shapely>=2.0",
    "pyproj>=3.0",
    "folium>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
]
postgis = [
    "psycopg2-binary>=2.9",
]

[project.urls]
Repository = "https://github.com/rlemke/osm"

[project.entry-points."facetwork.examples"]
osm-geocoder = "osm_geocoder:example"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osm_geocoder = [
    "ffl/*.ffl",
    "handlers/**/ffl/*.ffl",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/osm_geocoder/handlers"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
